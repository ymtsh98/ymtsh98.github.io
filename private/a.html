    if (/^[A-Za-z0-9_-]{43}$/.test(token)) {
      const bytes = Uint8Array.from(atob(token.replace(/-/g, '+').replace(/_/g, '/') + '='), char => char.charCodeAt(0));
      const key = await crypto.subtle.importKey('raw', bytes, 'AES-GCM', false, ['decrypt']);
      const images = [document.getElementById('front'), document.getElementById('back')];
      const payloads = JSON.parse(document.getElementById('payload').textContent);
      for (let index = 0; index < images.length; index++) {
        const data = Uint8Array.from(atob(payloads[index]), char => char.charCodeAt(0));
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
        images[index].src = URL.createObjectURL(new Blob([plain], { type: 'image/jpeg' }));
        await images[index].decode();
      }
      let side = 0;
      let busy = false;
      const flip = document.getElementById('flip');
      flip.addEventListener('click', () => {
        if (busy) return;
        busy = true;
        side = 1 - side;
        flip.classList.toggle('flipped', side === 1);
        flip.classList.add('moving');
        images[0].setAttribute('aria-hidden', String(side === 1));
        images[1].setAttribute('aria-hidden', String(side === 0));
        setTimeout(() => { flip.classList.remove('moving'); busy = false; }, 830);
        flip.setAttribute('aria-label', side === 0 ? 'Show back' : 'Show front');
        document.getElementById('hint').textContent = (side + 1) + ' / 2 · Tap to flip';
      });
      document.getElementById('viewer').hidden = false;
      document.getElementById('status').hidden = true;
    }
  </script>
</body>
</html>
