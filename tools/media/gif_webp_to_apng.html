<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>GIF/WebP to APNG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css?v=20261115-apng-option-stack">
  <script src="../../js/box-connections.js?v=20260803-shared-connections-8" defer></script>
  <script src="../../js/hand-drawn-frames.js?v=20260803-ballpoint-frames-4" defer></script>
</head>
<body>
  <canvas class="handDrawnFrames" aria-hidden="true"></canvas>
  <div class="page toolPage">
    <main class="toolContent contentFrame">
      <h1>GIF/WebP to APNG (offline)</h1>
      <br />
      <div class="controls">
        <label id="dropZone" class="dropZone disabled" for="fileInput">
          <input id="fileInput" type="file" accept="image/gif,image/webp,image/png,image/apng,.gif,.webp,.png,.apng" disabled>
          <span class="dropTitle">Drop a GIF, WebP, APNG, or PNG here</span>
          <span class="dropHint">or click to choose a file</span>
        </label>
        <div class="encodingOptions">
          <div>
            <div><label for="colorLimit">Maximum Colors:</label> <span id="colorLimitHint">Fewer colors -&gt; smaller file & lower quality</span></div>
            <select id="colorLimit" aria-describedby="colorLimitHint" disabled>
              <option value="0">Original colors</option>
              <option value="256">256</option>
              <option value="128">128</option>
              <option value="64">64</option>
              <option value="32">32</option>
              <option value="16">16</option>
              <option value="8">8</option>
              <option value="4">4</option>
            </select>
          </div>
          <div>
            <div><label for="tolerance">Frame Diff Tolerance:</label> <span id="toleranceHint">Higher value -&gt; smaller file & lower quality</span></div>
            <input id="tolerance" type="number" min="0" max="255" step="1" value="0" aria-describedby="toleranceHint" disabled>
          </div>
        </div>
        <button id="convertButton" type="button" disabled>Convert to APNG</button>
        <progress id="progress" max="100" value="0"></progress>
      </div>

      <p id="status" role="status" aria-live="polite">Checking browser support</p>

      <section id="result" hidden>
        <img id="preview" alt="Converted APNG preview">
        <a id="downloadLink" class="download" download>Download APNG</a>
        <p id="details" class="details"></p>
      </section>
    </main>

    <footer class="siteFooter">
      <p>The source code of this website is licensed under the <a href="../../license.html">MIT License</a>.</p>
    </footer>
  </div>

  <script id="workerCode" type="text/worker">
    const encoder = new TextEncoder();
    const crcTable = makeCrcTable();
    const signature = new Uint8Array([
      137, 80, 78, 71, 13, 10, 26, 10
    ]);
    const colorBinCount = 1 + 17 * 32 ** 3;
    const filterCosts = Uint8Array.from({ length: 256 }, (_, value) => Math.min(value, 256 - value));
    const decodedFrameCacheBytes = 64 * 1024 * 1024;
    const rgbaCopyOptions = { format: "RGBA", colorSpace: "srgb" };
    let kernelsPromise;
    let rgbaCopySupport;

    async function loadKernels(url) {
      try {
        const response = await fetch(url);

        if (!response.ok) {
          return null;
        }

        const { instance } = await WebAssembly.instantiate(await response.arrayBuffer());
        return instance.exports;
      } catch {
        return null;
      }
    }

    function getKernelBuffer(kernels, size) {
      const offset = kernels.__heap_base.value;
      const required = offset + size - kernels.memory.buffer.byteLength;

      if (required > 0) {
        kernels.memory.grow(Math.ceil(required / 65536));
      }

      return offset;
    }

    function getUint24(view, offset) {
      return view.getUint8(offset)
        | view.getUint8(offset + 1) << 8
        | view.getUint8(offset + 2) << 16;
    }

    function getWebpInfo(buffer) {
      const data = new Uint8Array(buffer);
      const view = new DataView(buffer);
      const frames = [];
      let loop = 0;
      let offset = 12;

      while (offset + 8 <= data.length) {
        const name = String.fromCharCode(
          data[offset],
          data[offset + 1],
          data[offset + 2],
          data[offset + 3]
        );
        const size = view.getUint32(offset + 4, true);
        const start = offset + 8;

        if (name === "ANIM" && size >= 6) {
          loop = view.getUint16(start + 4, true);
        } else if (name === "ANMF" && size >= 16) {
          const flags = view.getUint8(start + 15);

          frames.push({
            x: getUint24(view, start) * 2,
            y: getUint24(view, start + 3) * 2,
            width: getUint24(view, start + 6) + 1,
            height: getUint24(view, start + 9) + 1,
            reset: (flags & 1) === 1
          });
        }

        offset += 8 + size + (size & 1);
      }

      return { loop, frames };
    }

    function getPngInfo(buffer) {
      const bytes = new Uint8Array(buffer);

      if (!signature.every((value, index) => bytes[index] === value)) {
        throw new Error("Invalid PNG file");
      }

      const view = new DataView(buffer);
      const delays = [];
      let frameCount = 0;
      let loop = 0;
      let hasPoster = false;

      for (let offset = signature.length; offset + 12 <= bytes.length;) {
        const length = view.getUint32(offset);
        const name = String.fromCharCode(...bytes.subarray(offset + 4, offset + 8));
        const start = offset + 8;
        const next = start + length + 4;

        if (next > bytes.length) {
          throw new Error("Incomplete PNG file");
        }

        if (name === "acTL" && length === 8) {
          frameCount = view.getUint32(start);
          loop = view.getUint32(start + 4);
        } else if (name === "fcTL" && length === 26) {
          delays.push([view.getUint16(start + 20), view.getUint16(start + 22)]);
        } else if (name === "IDAT" && frameCount && delays.length === 0) {
          hasPoster = true;
        } else if (name === "IEND") {
          break;
        }

        offset = next;
      }

      return { loop, frameCount, delays, hasPoster };
    }

    function skipGifBlocks(data, offset) {
      let next = offset;

      while (next < data.length) {
        const size = data[next];
        next += 1;

        if (size === 0) {
          break;
        }

        next += size;
      }

      return next;
    }

    function getGifInfo(buffer) {
      const data = new Uint8Array(buffer);
      const view = new DataView(buffer);
      const frames = [];
      let loop = 0;
      let disposal = 0;
      let offset = 13;
      const packed = data[10];

      if (packed & 0x80) {
        offset += 3 * 2 ** ((packed & 0x07) + 1);
      }

      while (offset < data.length) {
        const block = data[offset];

        if (block === 0x3b) {
          break;
        }

        if (block === 0x2c) {
          const x = view.getUint16(offset + 1, true);
          const y = view.getUint16(offset + 3, true);
          const width = view.getUint16(offset + 5, true);
          const height = view.getUint16(offset + 7, true);
          const imagePacked = data[offset + 9];

          frames.push({
            x,
            y,
            width,
            height,
            reset: disposal === 2 || disposal === 3
          });

          disposal = 0;
          offset += 10;

          if (imagePacked & 0x80) {
            offset += 3 * 2 ** ((imagePacked & 0x07) + 1);
          }

          offset += 1;
          offset = skipGifBlocks(data, offset);
          continue;
        }

        if (block === 0x21) {
          const label = data[offset + 1];

          if (label === 0xf9) {
            disposal = (data[offset + 3] >> 2) & 0x07;
            offset += 8;
            continue;
          }

          if (label === 0xff) {
            const size = data[offset + 2];
            const start = offset + 3;
            const name = String.fromCharCode(...data.subarray(start, start + size));
            let next = start + size;

            while (next < data.length) {
              const blockSize = data[next];
              next += 1;

              if (blockSize === 0) {
                break;
              }

              if (
                (name === "NETSCAPE2.0" || name === "ANIMEXTS1.0")
                && blockSize >= 3
                && data[next] === 1
              ) {
                const count = data[next + 1] | data[next + 2] << 8;
                loop = count === 0 ? 0 : count + 1;
              }

              next += blockSize;
            }

            offset = next;
            continue;
          }

          if (label === 0x01) {
            const size = data[offset + 2];
            offset = skipGifBlocks(data, offset + 3 + size);
            disposal = 0;
            continue;
          }

          offset = skipGifBlocks(data, offset + 2);
          continue;
        }

        break;
      }

      return { loop, frames };
    }

    function getFrameRect(index, frames, width, height) {
      if (index === 0 || !frames[index]) {
        return { x: 0, y: 0, width, height };
      }

      const current = frames[index];
      let left = current.x;
      let top = current.y;
      let right = current.x + current.width;
      let bottom = current.y + current.height;
      const previous = frames[index - 1];

      if (previous && previous.reset) {
        left = Math.min(left, previous.x);
        top = Math.min(top, previous.y);
        right = Math.max(right, previous.x + previous.width);
        bottom = Math.max(bottom, previous.y + previous.height);
      }

      left = Math.max(0, Math.min(left, width - 1));
      top = Math.max(0, Math.min(top, height - 1));
      right = Math.max(left + 1, Math.min(right, width));
      bottom = Math.max(top + 1, Math.min(bottom, height));

      return {
        x: left,
        y: top,
        width: right - left,
        height: bottom - top
      };
    }

    function makeCrcTable() {
      const table = new Uint32Array(256);

      for (let index = 0; index < 256; index += 1) {
        let value = index;

        for (let bit = 0; bit < 8; bit += 1) {
          value = value & 1
            ? 0xedb88320 ^ (value >>> 1)
            : value >>> 1;
        }

        table[index] = value >>> 0;
      }

      return table;
    }

    function getCrc(type, data) {
      let value = 0xffffffff;

      for (let index = 0; index < type.length; index += 1) {
        value = crcTable[(value ^ type[index]) & 0xff] ^ (value >>> 8);
      }

      for (let index = 0; index < data.length; index += 1) {
        value = crcTable[(value ^ data[index]) & 0xff] ^ (value >>> 8);
      }

      return (value ^ 0xffffffff) >>> 0;
    }

    function makeChunk(name, data) {
      const type = encoder.encode(name);
      const chunk = new Uint8Array(data.length + 12);
      const view = new DataView(chunk.buffer);

      view.setUint32(0, data.length);
      chunk.set(type, 4);
      chunk.set(data, 8);
      view.setUint32(data.length + 8, getCrc(type, data));

      return chunk;
    }

    function makeHeader(width, height, bitDepth, colorType) {
      const data = new Uint8Array(13);
      const view = new DataView(data.buffer);

      view.setUint32(0, width);
      view.setUint32(4, height);
      data[8] = bitDepth;
      data[9] = colorType;

      return makeChunk("IHDR", data);
    }

    function makeAnimation(frameCount, loop) {
      const data = new Uint8Array(8);
      const view = new DataView(data.buffer);

      view.setUint32(0, frameCount);
      view.setUint32(4, loop);

      return makeChunk("acTL", data);
    }

    function getGreatestDivisor(left, right) {
      let first = left;
      let second = right;

      while (second !== 0) {
        const next = first % second;
        first = second;
        second = next;
      }

      return first;
    }

    function getDelay(value) {
      const delay = Math.max(0, Math.round(value));

      if (delay <= 65535) {
        return [delay, 1000];
      }

      const divisor = getGreatestDivisor(delay, 1000);
      const numerator = delay / divisor;
      const denominator = 1000 / divisor;

      if (numerator <= 65535) {
        return [numerator, denominator];
      }

      const scaledDenominator = Math.max(1, Math.floor(65535 * 1000 / delay));
      const scaledNumerator = Math.min(65535, Math.round(delay * scaledDenominator / 1000));

      return [scaledNumerator, scaledDenominator];
    }

    function makeFrame(sequence, rect, delay, blend) {
      const data = new Uint8Array(26);
      const view = new DataView(data.buffer);

      view.setUint32(0, sequence);
      view.setUint32(4, rect.width);
      view.setUint32(8, rect.height);
      view.setUint32(12, rect.x);
      view.setUint32(16, rect.y);
      view.setUint16(20, delay[0]);
      view.setUint16(22, delay[1]);
      data[24] = 0;
      data[25] = blend;

      return makeChunk("fcTL", data);
    }

    function getDifferenceRect(previous, current, width, height, tolerance) {
      const previousWords = new Uint32Array(previous.buffer, previous.byteOffset, previous.length / 4);
      const currentWords = new Uint32Array(current.buffer, current.byteOffset, current.length / 4);
      let left = width;
      let top = height;
      let right = -1;
      let bottom = -1;

      for (let y = 0; y < height; y += 1) {
        const row = y * width;

        for (let x = 0; x < width; x += 1) {
          const index = row + x;
          const offset = index * 4;

          if (
            previousWords[index] !== currentWords[index]
            && (tolerance === 0
              || Math.abs(previous[offset] - current[offset]) > tolerance
              || Math.abs(previous[offset + 1] - current[offset + 1]) > tolerance
              || Math.abs(previous[offset + 2] - current[offset + 2]) > tolerance
              || Math.abs(previous[offset + 3] - current[offset + 3]) > tolerance)
          ) {
            left = Math.min(left, x);
            top = Math.min(top, y);
            right = Math.max(right, x);
            bottom = Math.max(bottom, y);
          }
        }
      }

      if (right < 0) {
        return null;
      }

      return {
        x: left,
        y: top,
        width: right - left + 1,
        height: bottom - top + 1
      };
    }

    function getColor(pixels, offset) {
      return (pixels[offset] | pixels[offset + 1] << 8
        | pixels[offset + 2] << 16 | pixels[offset + 3] << 24) >>> 0;
    }

    function getColorBin(color) {
      const alpha = color >>> 24;

      if (alpha === 0) {
        return 0;
      }

      const alphaBin = alpha === 255 ? 16 : alpha >> 4;
      return 1 + ((alphaBin << 15) | ((color >>> 3 & 31) << 10)
        | ((color >>> 11 & 31) << 5) | (color >>> 19 & 31));
    }

    function addColorToBins(bins, color, count) {
      const key = getColorBin(color);
      const { counts, red, green, blue, alpha, keys } = bins;

      if (counts[key] === 0) {
        keys.push(key);
      }

      counts[key] += count;
      red[key] += (color & 255) * count;
      green[key] += (color >>> 8 & 255) * count;
      blue[key] += (color >>> 16 & 255) * count;
      alpha[key] += (color >>> 24) * count;
    }

    function collectColors(histogram, pixels) {
      const words = new Uint32Array(pixels.buffer, pixels.byteOffset, pixels.length / 4);
      let { exact, bins } = histogram;
      let index = 0;

      while (exact && index < words.length) {
        const start = index;
        const word = words[index];
        index += 1;

        while (index < words.length && words[index] === word) {
          index += 1;
        }

        const color = getColor(pixels, start * 4);
        exact.set(color, (exact.get(color) || 0) + index - start);

        if (exact.size > 65536) {
          bins = {
            counts: new Float64Array(colorBinCount),
            red: new Float64Array(colorBinCount),
            green: new Float64Array(colorBinCount),
            blue: new Float64Array(colorBinCount),
            alpha: new Float64Array(colorBinCount),
            keys: []
          };

          for (const [entry, count] of exact) {
            addColorToBins(bins, entry, count);
          }

          exact = null;
          histogram.exact = null;
          histogram.bins = bins;
        }
      }

      while (index < words.length) {
        const start = index;
        const word = words[index];
        index += 1;

        while (index < words.length && words[index] === word) {
          index += 1;
        }

        addColorToBins(bins, getColor(pixels, start * 4), index - start);
      }
    }

    function makeColorBox(entries) {
      const sums = [0, 0, 0, 0];
      const squares = [0, 0, 0, 0];
      let count = 0;

      for (const entry of entries) {
        count += entry.count;

        for (let channel = 0; channel < 4; channel += 1) {
          const value = entry.channels[channel];
          sums[channel] += value * entry.count;
          squares[channel] += value * value * entry.count;
        }
      }

      const mean = sums.map((sum) => sum / count);
      let axis = 0;
      let score = -1;

      if (entries.length > 1) {
        for (let channel = 0; channel < 4; channel += 1) {
          const weight = channel === 3 ? 4 : 1;
          const variance = (squares[channel] - sums[channel] * mean[channel]) * weight;

          if (variance > score) {
            axis = channel;
            score = variance;
          }
        }
      }

      return { entries, count, color: getColor(mean.map(Math.round), 0), axis, score };
    }

    function quantizeColors(entries, limit) {
      const groups = [[], [], []];

      for (const entry of entries) {
        const alpha = entry.channels[3];
        const group = alpha === 0 ? 0 : alpha === 255 ? 2 : 1;
        groups[group].push(entry);
      }

      const boxes = groups.filter((group) => group.length > 0).map(makeColorBox);

      while (boxes.length < limit) {
        let split = -1;
        let bestScore = -1;

        for (let index = 0; index < boxes.length; index += 1) {
          if (boxes[index].score > bestScore) {
            split = index;
            bestScore = boxes[index].score;
          }
        }

        if (split < 0) {
          break;
        }

        const { entries, count, axis } = boxes[split];
        entries.sort((left, right) => left.channels[axis] - right.channels[axis]);
        let cut = 1;
        let leftCount = entries[0].count;

        while (cut < entries.length - 1 && leftCount < count / 2) {
          leftCount += entries[cut].count;
          cut += 1;
        }

        boxes[split] = makeColorBox(entries.slice(0, cut));
        boxes.push(makeColorBox(entries.slice(cut)));
      }

      return boxes;
    }

    async function buildPalette(decoder, frameCount, canvas, context, limit, kernels, poster) {
      const histogram = { exact: new Map(), bins: null };
      let frames = null;
      kernels?.resetHistogram();

      function collect(pixels) {
        if (kernels) {
          const offset = getKernelBuffer(kernels, pixels.byteLength);
          new Uint8Array(kernels.memory.buffer, offset, pixels.byteLength).set(pixels);
          kernels.collectPixels(offset, pixels.length / 4);
        } else {
          collectColors(histogram, pixels);
        }
      }

      if (poster) {
        collect(poster.pixels);
      }

      for (let index = 0; index < frameCount; index += 1) {
        report(index / frameCount / 2, index, frameCount, "palette");
        const frame = await readFrame(decoder, index, canvas, context);
        const { pixels } = frame;

        if (index === 0 && pixels.byteLength * frameCount <= decodedFrameCacheBytes) {
          frames = [];
        }

        frames?.push(frame);
        collect(pixels);
      }

      const { colors, mapColor } = kernels
        ? readKernelPalette(kernels, limit)
        : getJavaScriptPalette(histogram, limit);
      const unique = [...new Set(colors)].sort((left, right) => (left >>> 24) - (right >>> 24));
      const count = unique.length;
      const bitDepth = count <= 2 ? 1 : count <= 4 ? 2 : count <= 16 ? 4 : 8;
      const indices = new Map(unique.map((color, index) => [color, index]));

      return { palette: { colors: unique, mapColor, indices, bitDepth }, frames };
    }

    function readKernelPalette(kernels, limit) {
      const signedSize = kernels.getHistogramSize();
      const size = Math.abs(signedSize);
      const mapped = signedSize < 0 || size > limit;
      const colorBytes = limit * 4;
      const mappingBytes = mapped ? size * 8 : 0;
      const workspaceBytes = mapped ? kernels.getPaletteWorkspaceSize() : 0;
      const offset = getKernelBuffer(kernels, colorBytes + mappingBytes + workspaceBytes);
      const mappingOffset = offset + colorBytes;
      const count = kernels.buildPalette(limit, offset, mappingOffset, mappingOffset + mappingBytes);
      const colors = new Uint32Array(kernels.memory.buffer, offset, count);
      let mapColor = null;

      if (mapped) {
        const mapping = new Uint32Array(kernels.memory.buffer, mappingOffset, size * 2);

        if (signedSize < 0) {
          const lookup = new Uint32Array(colorBinCount);

          for (let index = 0; index < mapping.length; index += 2) {
            lookup[mapping[index]] = mapping[index + 1];
          }

          mapColor = (color) => lookup[getColorBin(color)];
        } else {
          const lookup = new Map();

          for (let index = 0; index < mapping.length; index += 2) {
            lookup.set(mapping[index], mapping[index + 1]);
          }

          mapColor = (color) => lookup.get(color);
        }
      }

      return { colors, mapColor };
    }

    function getJavaScriptPalette(histogram, limit) {
      const { exact, bins } = histogram;
      let colors;
      let mapColor = null;

      if (exact && exact.size <= limit) {
        colors = exact.keys();
      } else {
        const entries = exact
          ? Array.from(exact, ([key, count]) => ({
            key,
            count,
            channels: [key & 255, key >>> 8 & 255, key >>> 16 & 255, key >>> 24]
          }))
          : bins.keys.map((key) => {
            const count = bins.counts[key];
            const channels = [bins.red[key], bins.green[key], bins.blue[key], bins.alpha[key]];
            return { key, count, channels: channels.map((sum) => sum / count) };
          });

        const boxes = quantizeColors(entries, limit);
        colors = boxes.map((box) => box.color);

        if (exact) {
          const lookup = new Map();

          for (const box of boxes) {
            for (const entry of box.entries) {
              lookup.set(entry.key, box.color);
            }
          }

          mapColor = (color) => lookup.get(color);
        } else {
          const lookup = new Uint32Array(colorBinCount);

          for (const box of boxes) {
            for (const entry of box.entries) {
              lookup[entry.key] = box.color;
            }
          }

          mapColor = (color) => lookup[getColorBin(color)];
        }
      }

      return { colors, mapColor };
    }

    function applyPalette(pixels, mapColor) {
      for (let offset = 0; offset < pixels.length; offset += 4) {
        const color = mapColor(getColor(pixels, offset));
        pixels[offset] = color & 255;
        pixels[offset + 1] = color >>> 8 & 255;
        pixels[offset + 2] = color >>> 16 & 255;
        pixels[offset + 3] = color >>> 24;
      }
    }

    function appendPalette(chunks, colors) {
      const rgb = new Uint8Array(colors.length * 3);
      const alpha = new Uint8Array(colors.length);
      let alphaLength = 0;

      for (let index = 0; index < colors.length; index += 1) {
        const color = colors[index];
        rgb[index * 3] = color & 255;
        rgb[index * 3 + 1] = color >>> 8 & 255;
        rgb[index * 3 + 2] = color >>> 16 & 255;
        alpha[index] = color >>> 24;

        if (alpha[index] !== 255) {
          alphaLength = index + 1;
        }
      }

      chunks.push(makeChunk("PLTE", rgb));

      if (alphaLength) {
        chunks.push(makeChunk("tRNS", alpha.subarray(0, alphaLength)));
      }
    }

    function packIndices(pixels, width, height, rowSize, palette) {
      const { bitDepth, indices } = palette;
      const packed = new Uint8Array(rowSize * height);

      for (let y = 0; y < height; y += 1) {
        for (let x = 0; x < width; x += 1) {
          const index = indices.get(getColor(pixels, (y * width + x) * 4));
          const bit = x * bitDepth;
          packed[y * rowSize + (bit >> 3)] |= index << (8 - bitDepth - (bit & 7));
        }
      }

      return packed;
    }

        kernelsUrl: new URL("apng-kernels.wasm", window.location.href).href
      });
    });

    initialize();
  </script>
</body>
